<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cat App — AWS 101</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --card: #171a21;
      --text: #f4f4f5;
      --muted: #9ca3af;
      --accent: #ff9900; /* AWS orange, why not */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 2rem 1rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    p.subtitle { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      width: min(90vw, 420px);
    }
    img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      background: #000;
      display: block;
    }
    button {
      margin-top: 0.5rem;
      padding: 0.65rem 1.5rem;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #111;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    footer { color: var(--muted); font-size: 0.75rem; }
  </style>
</head>
<body>
  <h1>🐱 Cat App</h1>
  <p class="subtitle">Demo de despliegue — AWS Community Santo Domingo</p>
  <div class="card">
    <img id="cat-img" src="" alt="Un gato random" />
    <div>
      <button id="btn-new-cat">Otro gato</button>
    </div>
  </div>
  <footer>Imágenes de <a href="https://thecatapi.com" target="_blank" rel="noopener" style="color: var(--accent)">thecatapi.com</a></footer>

  <script>
    const img = document.getElementById('cat-img');
    const btn = document.getElementById('btn-new-cat');

    async function loadCat() {
      btn.disabled = true;
      try {
        const res = await fetch('https://api.thecatapi.com/v1/images/search');
        const data = await res.json();
        img.src = data[0].url;
      } catch (err) {
        console.error('No se pudo cargar el gato:', err);
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', loadCat);
    loadCat();
  </script>
</body>
</html>
