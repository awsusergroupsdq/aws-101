name: "01 - Provision: EC2"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Qué acción de tofu correr"
        type: choice
        options:
          - plan
          - apply
        default: plan

# ATENCIÓN: el state de este stack es local/efímero (sin backend remoto, a
# propósito — ver infra/README.md). Vive solo dentro de este job: no se
# guarda como artifact ni en ningún otro lado. Cada corrida de "apply" parte
# de cero. Si ya tenés recursos de base-fargate corriendo (mismo nombre de
# repo ECR "cat-app"), destruilos primero con 03-destroy.

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  provision:
    name: tofu ${{ inputs.action }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/base-ec2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.6"

      - name: tofu init
        run: tofu init -input=false

      - name: tofu validate
        run: tofu validate

      - name: tofu plan
        run: tofu plan -input=false -out=tfplan

      - name: tofu apply
        if: inputs.action == 'apply'
        run: tofu apply -input=false -auto-approve tfplan

      - name: Resumen
        if: inputs.action == 'apply'
        run: |
          {
            echo "### EC2 provisionado y app desplegada"
            echo "El apply ya buildeó, publicó y desplegó \`cat-app\` — no hace falta ningún paso más."
            echo ""
            echo "\`\`\`"
            tofu output
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
